[project]
name = "review-distill"
version = "0.1.0"
description = "Distill a large LLM (Gemini) into a small model that extracts structured diagnoses from Portuguese customer reviews."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "huggingface-hub>=0.25",
    "kagglehub>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Fine-tuning and local inference of the student model (run `uv sync --extra train`).
# bitsandbytes is only installed on Linux (Colab/Kaggle GPU).
train = [
    "transformers>=4.45",
    "datasets>=3.0",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44; sys_platform == 'linux'",
]
app = [
    "gradio>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_distill"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
